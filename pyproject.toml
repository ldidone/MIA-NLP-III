[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compufix-agents"
version = "0.1.0"
description = "A multi-agent system that diagnoses and assists with common computer usage problems."
readme = "README.md"
# numpy < 2.0 (required by the pinned langchain 0.3 stack) has no Python 3.13
# wheels, so the supported range is 3.11–3.12.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "CompuFix Agents Team" }]
# Pinned to keep the LangChain 0.3 generation mutually compatible. See
# requirements.txt for the rationale behind the upper bounds.
dependencies = [
    "langgraph>=0.2.28,<0.3",
    "langchain>=0.3.0,<0.4",
    "langchain-core>=0.3.15,<0.4",
    "langchain-community>=0.3.0,<0.4",
    "langchain-openai>=0.2.0,<0.3",
    "chromadb>=0.5.6,<0.6",
    "langchain-chroma>=0.1.4,<0.2",
    "numpy>=1.26.0,<2.0.0",
    "streamlit>=1.36.0",
    "psutil>=6.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
# Offline semantic retrieval (local embeddings; no API key required).
# Kept out of the base install because it pulls in torch.
local = [
    "sentence-transformers>=2.6.0,<4.0.0",
    "langchain-huggingface>=0.1.2,<0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["compufix_agents"]
